[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwave"
version = "0.6.0"
description = "Open-source music player for every device, with a synced library and listen-together."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "ytmusicapi>=1.10",
  "yt-dlp[default]>=2025.11.12",
  # OpenWave Connect (phones reach this engine from anywhere): the vendored aiortc's dependencies.
  "aioice>=0.10.2,<1",
  "cryptography>=44",
  "google-crc32c>=1.1",
  "pyee>=13",
  "pylibsrtp>=0.10",
  "pyopenssl>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.48"]
# The Windows app's own window (openwave/winshell.py): WebView2, through pywebview.
windows = ["pywebview>=5.3"]

[project.scripts]
openwave = "openwave.__main__:main"

[tool.setuptools.packages.find]
include = ["openwave*"]

[tool.setuptools.package-data]
openwave = ["web/*", "web/**/*"]
"openwave._vendor.aiortc" = ["LICENSE", "VERSION"]
