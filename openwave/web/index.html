<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenWave</title>
  <meta name="description" content="Free and open-source music for everyone. No ads, no subscriptions, no premium.">
  <meta name="theme-color" content="#0a0b14">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#/home"><img class="logo-img" src="/icons/logo-mark-128.png" alt=""><span class="wordmark">Open<b>Wave</b></span></a>
    <nav class="side-nav">
      <a href="#/home" data-route="home"><svg><use href="#i-home"/></svg>Home</a>
      <a href="#/search" data-route="search"><svg><use href="#i-search"/></svg>Search</a>
      <a href="#/library" data-route="library"><svg><use href="#i-library"/></svg>Your Library</a>
      <a href="#/downloads" data-route="downloads"><svg><use href="#i-download"/></svg>Downloads</a>
      <a href="#/insights" data-route="insights"><svg><use href="#i-chart"/></svg>Insights</a>
    </nav>
    <div class="offline-pill" hidden><svg><use href="#i-offline"/></svg>Offline — playing downloads</div>
    <div class="side-lib">
      <div class="side-head">
        <span>Playlists</span>
        <button class="icon-btn sm" data-act="new-playlist" title="New playlist" aria-label="New playlist"><svg><use href="#i-plus"/></svg></button>
      </div>
      <div class="side-list" id="side-list"></div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <div class="nav-arrows">
        <button class="icon-btn round" data-act="back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
        <button class="icon-btn round" data-act="forward" aria-label="Forward"><svg><use href="#i-forward"/></svg></button>
      </div>
      <a class="brand mobile-only" href="#/home"><img class="logo-img" src="/icons/logo-mark-128.png" alt=""><span class="wordmark">Open<b>Wave</b></span></a>
      <div class="topbar-title ellipsis" id="topbar-title" aria-hidden="true"></div>
      <form class="searchbar" id="search-form" role="search" autocomplete="off">
        <svg><use href="#i-search"/></svg>
        <input id="search-input" type="search" enterkeyhint="search" placeholder="What do you want to listen to?" aria-label="Search">
        <div class="suggest" id="suggest" hidden></div>
      </form>
      <div class="top-actions">
        <a class="icon-btn round" href="#/settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></a>
        <button class="profile-chip" id="profile-chip" data-act="profile-menu" aria-label="Profile"></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<footer class="playerbar" id="playerbar" data-empty>
  <div class="pb-progress-mini"><i data-bind="progress"></i></div>
  <div class="pb-left" data-act="open-np">
    <img class="pb-art" data-bind="art-sm" alt="">
    <div class="pb-meta">
      <div class="pb-title ellipsis" data-bind="title">Nothing playing</div>
      <div class="pb-artist ellipsis" data-bind="artists">Search for something to play</div>
      <div class="pb-device" data-bind="device" data-act="devices" hidden></div>
    </div>
    <button class="icon-btn like-btn desktop-only" data-act="like-current" aria-label="Like"><svg><use href="#i-heart"/></svg></button>
  </div>
  <div class="pb-center">
    <div class="controls">
      <button class="icon-btn toggle desktop-only" data-act="shuffle" data-bind="shuffle" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn desktop-only" data-act="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="play-btn" data-act="toggle" data-bind="play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="icon-btn" data-act="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="icon-btn toggle desktop-only" data-act="repeat" data-bind="repeat" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
    </div>
    <div class="seek desktop-only">
      <span class="time" data-bind="cur">0:00</span>
      <input type="range" class="range" data-bind="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <span class="time" data-bind="dur">0:00</span>
    </div>
  </div>
  <div class="pb-right desktop-only">
    <button class="icon-btn" data-act="np-lyrics" title="Lyrics" aria-label="Lyrics"><svg><use href="#i-lyrics"/></svg></button>
    <button class="icon-btn" data-act="np-queue" title="Queue" aria-label="Queue"><svg><use href="#i-queue"/></svg></button>
    <button class="icon-btn toggle" data-act="sleep" title="Sleep timer" aria-label="Sleep timer"><svg><use href="#i-moon"/></svg></button>
    <button class="icon-btn toggle link-only" data-act="devices" title="Devices" aria-label="Devices"><svg><use href="#i-devices"/></svg></button>
    <button class="icon-btn" data-act="mute" data-bind="mute" aria-label="Mute"><svg><use href="#i-volume"/></svg></button>
    <input type="range" class="range vol" id="volume" min="0" max="100" value="80" aria-label="Volume">
    <button class="icon-btn" data-act="open-np" title="Now playing" aria-label="Expand"><svg><use href="#i-expand"/></svg></button>
  </div>
</footer>

<nav class="tabbar">
  <a href="#/home" data-route="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
  <a href="#/search" data-route="search"><svg><use href="#i-search"/></svg><span>Search</span></a>
  <a href="#/library" data-route="library"><svg><use href="#i-library"/></svg><span>Library</span></a>
  <a href="#/downloads" data-route="downloads"><svg><use href="#i-download"/></svg><span>Downloads</span></a>
</nav>

<section class="np" id="np" hidden aria-label="Now playing">
  <div class="np-bg" data-bind="np-bg"></div>
  <header class="np-head">
    <button class="icon-btn round" data-act="close-np" aria-label="Close"><svg><use href="#i-down"/></svg></button>
    <div class="np-from ellipsis"><small>Playing from</small><b data-bind="context">Queue</b></div>
    <button class="icon-btn toggle" data-act="sleep" title="Sleep timer" aria-label="Sleep timer"><svg><use href="#i-moon"/></svg></button>
    <button class="icon-btn toggle link-only" data-act="devices" title="Devices" aria-label="Devices"><svg><use href="#i-devices"/></svg></button>
    <button class="icon-btn" data-act="np-more" title="More" aria-label="More"><svg><use href="#i-more"/></svg></button>
  </header>
  <div class="np-body">
    <div class="np-stage" id="np-stage">
      <img class="np-art" data-bind="art" alt="">
      <div class="np-spinner" data-bind="spinner"></div>
    </div>
    <div class="np-panel">
      <div class="tabs">
        <button data-tab="queue" class="on">Up next</button>
        <button data-tab="lyrics">Lyrics</button>
      </div>
      <div class="np-tab" id="np-queue"></div>
      <div class="np-tab" id="np-lyrics" hidden></div>
    </div>
  </div>
  <div class="np-controls">
    <div class="np-meta">
      <div class="ellipsis">
        <div class="np-title ellipsis" data-bind="title"></div>
        <div class="np-artist ellipsis" data-bind="artists"></div>
      </div>
      <button class="icon-btn like-btn" data-act="like-current" aria-label="Like"><svg><use href="#i-heart"/></svg></button>
    </div>
    <input type="range" class="range" data-bind="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="np-times"><span data-bind="cur">0:00</span><span data-bind="dur">0:00</span></div>
    <div class="controls big">
      <button class="icon-btn toggle" data-act="shuffle" data-bind="shuffle" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn" data-act="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="play-btn" data-act="toggle" data-bind="play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="icon-btn" data-act="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="icon-btn toggle" data-act="repeat" data-bind="repeat" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
    </div>
    <button class="np-device" data-bind="device" data-act="devices" hidden></button>
    <div class="np-sheet-btns">
      <button data-act="sheet-queue"><svg><use href="#i-queue"/></svg>Up next</button>
      <button data-act="sheet-lyrics"><svg><use href="#i-lyrics"/></svg>Lyrics</button>
    </div>
  </div>
</section>
