# Builds the Windows installer and the Linux AppImage. Version tags run it through publish.yml,
# which puts them on the GitHub Release next to the macOS DMGs. Changes to the engine, the interface
# or the packaging build them on main too, so a broken Windows app shows up before a release.
name: Windows & Linux apps

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - openwave/**
      - packaging/**
      - .github/workflows/desktop.yml

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.7"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pyinstaller
      - name: Fetch Deno
        shell: pwsh
        run: |
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 "https://github.com/denoland/deno/releases/download/v$env:DENO_VERSION/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno
      - name: Freeze
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name OpenWave --icon packaging/windows/openwave.ico `
            --add-data "openwave/web;openwave/web" --collect-all yt_dlp_ejs --collect-data ytmusicapi `
            --collect-submodules yt_dlp --collect-submodules uvicorn `
            --collect-submodules openwave._vendor.aiortc --collect-submodules aioice --collect-submodules dns --exclude-module av `
            packaging/launcher_entry.py
          New-Item -ItemType Directory -Force dist/OpenWave/bin | Out-Null
          Copy-Item deno/deno.exe dist/OpenWave/bin/deno.exe
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $env:OPENWAVE_DATA = "$env:RUNNER_TEMP\owdata"
          $p = Start-Process dist/OpenWave/OpenWave.exe -ArgumentList "--server-only","--port","47999" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $h = Invoke-RestMethod http://127.0.0.1:47999/api/health; $ok = $true; break } catch { Start-Sleep 1 } }
          Stop-Process $p -Force
          if (-not $ok) { throw "engine did not start" }
          $h | ConvertTo-Json
          if ($h.jsRuntimes -notcontains "deno") { throw "bundled Deno not found" }
          if (-not $h.connect) { throw "OpenWave Connect is missing from the build" }
      - name: Smoke test Start with Windows
        shell: pwsh
        run: |
          $env:OPENWAVE_DATA = "$env:RUNNER_TEMP\owdata2"
          $p = Start-Process dist/OpenWave/OpenWave.exe -ArgumentList "--background" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:47878/api/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { Stop-Process $p -Force; throw "--background did not start the engine" }
          $again = Start-Process dist/OpenWave/OpenWave.exe -ArgumentList "--background" -PassThru
          if (-not $again.WaitForExit(30000)) { Stop-Process $again -Force; Stop-Process $p -Force; throw "a second --background did not leave" }
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $json = @{ "content-type" = "application/json" }
          try {
            $st = Invoke-RestMethod http://127.0.0.1:47878/api/connect/startup
            if (-not $st.available -or $st.on) { throw "unexpected startup state: $($st | ConvertTo-Json -Compress)" }
            $st = Invoke-RestMethod -Method Post http://127.0.0.1:47878/api/connect/startup -Headers $json -Body '{"on":true}'
            $value = (Get-ItemProperty $run -Name OpenWave).OpenWave
            "Run entry: $value"
            if (-not $st.on -or $value -notlike '*OpenWave.exe" --background') { throw "Start with Windows did not turn on" }
            $st = Invoke-RestMethod -Method Post http://127.0.0.1:47878/api/connect/startup -Headers $json -Body '{"on":false}'
            if ($st.on -or (Get-ItemProperty $run -Name OpenWave -ErrorAction SilentlyContinue)) { throw "Start with Windows did not turn off" }
          } finally { Stop-Process $p -Force }
      - name: Installer
        shell: pwsh
        run: |
          $env:OPENWAVE_VERSION = (python -c "import openwave; print(openwave.__version__)")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc packaging/windows/openwave.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $h = (Get-FileHash dist/OpenWave-Windows-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  OpenWave-Windows-Setup.exe" | Out-File -Encoding ascii dist/OpenWave-Windows-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWave-Windows
          path: dist/OpenWave-Windows-Setup.exe*

  linux:
    runs-on: ubuntu-22.04   # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pyinstaller
      - name: Freeze
        run: |
          pyinstaller --noconfirm --clean --name OpenWave \
            --add-data "openwave/web:openwave/web" --collect-all yt_dlp_ejs --collect-data ytmusicapi \
            --collect-submodules yt_dlp --collect-submodules uvicorn \
            --collect-submodules openwave._vendor.aiortc --collect-submodules aioice --collect-submodules dns --exclude-module av \
            packaging/launcher_entry.py
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip" -o deno.zip
          mkdir -p dist/OpenWave/bin && unzip -q deno.zip -d dist/OpenWave/bin
      - name: Smoke test the packaged app
        run: |
          OPENWAVE_DATA=$(mktemp -d) PATH=/usr/bin:/bin dist/OpenWave/OpenWave --server-only --port 47999 &
          for i in $(seq 1 60); do curl -sf localhost:47999/api/health > health.json && break; sleep 1; done
          cat health.json && grep -q '"deno"' health.json && grep -q '"connect":true' health.json
      - name: Smoke test Start when you log in
        run: |
          export OPENWAVE_DATA=$(mktemp -d) XDG_CONFIG_HOME=$(mktemp -d) APPIMAGE=$PWD/dist/OpenWave/OpenWave
          dist/OpenWave/OpenWave --background & engine=$!
          for i in $(seq 1 60); do curl -sf localhost:47878/api/health > /dev/null && break; sleep 1; done
          curl -sf localhost:47878/api/health > /dev/null || { echo "--background did not start the engine"; exit 1; }
          timeout 30 dist/OpenWave/OpenWave --background || { echo "a second --background did not leave"; exit 1; }
          curl -sf localhost:47878/api/connect/startup | tee st.json && grep -q '"available":true,"on":false,"system":"Linux"' st.json
          curl -sf -X POST -H 'content-type: application/json' -d '{"on":true}' localhost:47878/api/connect/startup | grep -q '"on":true'
          cat "$XDG_CONFIG_HOME/autostart/openwave.desktop"
          grep -qx "Exec=\"$APPIMAGE\" --background" "$XDG_CONFIG_HOME/autostart/openwave.desktop"
          curl -sf -X POST -H 'content-type: application/json' -d '{"on":false}' localhost:47878/api/connect/startup | grep -q '"on":false'
          test ! -e "$XDG_CONFIG_HOME/autostart/openwave.desktop"
          kill $engine
      - name: AppImage
        run: |
          ./packaging/linux/build-appimage.sh
          (cd dist && sha256sum OpenWave-Linux-x86_64.AppImage > OpenWave-Linux-x86_64.AppImage.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWave-Linux
          path: dist/OpenWave-Linux-x86_64.AppImage*
