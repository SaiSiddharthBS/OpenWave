# Publishes the download page in site/ to GitHub Pages whenever a release is published
# (so its download buttons always point at real files), or on demand.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/screenshots _site/screenshots
          cp docs/logo.png _site/logo.png
          cp openwave/web/icons/favicon-64.png _site/favicon-64.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
