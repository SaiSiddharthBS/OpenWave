# Publishes the website to GitHub Pages from main (the github-pages environment only accepts
# deployments from the default branch): the download page in site/, plus the web app phones use
# through OpenWave Connect (scripts/build-site.py: /app/ from the latest release, /app-next/ from
# main). It runs again when a release is published, so /app/ always matches the newest engines.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "openwave/web/**", "scripts/build-site.py", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0               # tags: /app/ is built from the latest release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble
        run: python scripts/build-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
