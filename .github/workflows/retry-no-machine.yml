# GitHub sometimes runs out of Apple Silicon machines and cancels a job before it has started, which
# marks the commit as failed although nothing was tested. This starts such a run again. Otherwise a
# job that ran and failed is retried only once, and only where a busy or broken machine can trip it:
# the UI tests (a real browser and engine) and a release (which also boots an Android emulator). A
# real failure fails again and stays red.
name: Retry when no machine was free

on:
  workflow_run:
    workflows: ["CI", "macOS app", "Release"]
    types: [completed]
  push:
    branches: [main]
    paths: [".github/workflows/retry-no-machine.yml"]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Start again what never got a machine, or UI tests that tripped once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.event.workflow_run.id }}
        run: |
          runs="$THIS_RUN"
          since=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          recent="map(select(.createdAt > \"$since\")) | .[].databaseId"
          [ -n "$runs" ] || runs=$(gh run list --branch main --status failure --limit 20 --json databaseId,createdAt --jq "$recent")
          newest=$(gh api "repos/$GH_REPO/tags?per_page=100" --jq '.[].name' | grep '^v' | sort -V | tail -1)
          for id in $runs; do
            attempt=$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .run_attempt)
            if [ "$attempt" -ge 4 ]; then continue; fi
            failed=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(",")')
            unstarted=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq 'any(.jobs[]; .conclusion == "cancelled" and (.steps | length) == 0)')
            again=false
            if [ -z "$failed" ] && [ "$unstarted" = "true" ]; then again=true; fi
            if [ "$failed" = "layout" ] && [ "$attempt" = "1" ]; then again=true; fi
            # A release only straight after it failed (never one found later), and only the newest version:
            # an older release published now would become the one everyone downloads.
            if [ -n "$failed" ] && [ "$attempt" = "1" ] && [ "$id" = "$THIS_RUN" ] \
              && [ "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .name)" = "Release" ] \
              && [ "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .head_branch)" = "$newest" ]; then again=true; fi
            if [ "$again" = "true" ]; then
              echo "Starting run $id again"
              gh run rerun "$id" --failed
            fi
          done
