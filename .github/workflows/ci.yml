name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  android-engine:
    # The Android app runs the engine on FastAPI 0.99 + pydantic 1.x (pure Python): keep it working there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fastapi==0.99.1" "pydantic==1.10.26" "uvicorn==0.30.6" "httpx==0.27.2" ytmusicapi yt-dlp pytest
      - run: PYTHONPATH=. pytest -q

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile the Swift app
        run: cd macos && swift build -c release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openwave .
