# Builds the native macOS app for Intel and Apple Silicon. On version tags (v0.2.0, …) the
# DMGs are attached to the GitHub Release so anyone can download OpenWave for Mac.
name: macOS app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["macos/**", "openwave/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build OpenWave.app and DMG
        run: |
          ./macos/build.sh
          cd macos/dist && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWave-${{ matrix.runner }}
          path: macos/dist/*.dmg*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/dist/*.dmg
            macos/dist/*.dmg.sha256
