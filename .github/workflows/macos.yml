# Builds the native macOS app for Intel and Apple Silicon. Version tags run it through
# publish.yml, which puts the DMGs on the GitHub Release.
name: macOS app

on:
  workflow_call:
  pull_request:
    paths: ["macos/**", "openwave/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build OpenWave.app and DMG
        run: |
          ./macos/build.sh
          cd macos/dist && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWave-${{ matrix.runner }}
          path: macos/dist/*.dmg*
