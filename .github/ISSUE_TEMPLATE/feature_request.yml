name: Feature request
description: Suggest an idea for OpenWave
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like OpenWave to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help people?
  - type: textarea
    id: how
    attributes:
      label: Anything else?
      description: How other apps do it, sketches or screenshots.
