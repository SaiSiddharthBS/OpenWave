name: Bug report
description: Something doesn't work
body:
  - type: markdown
    attributes:
      value: |
        **Playback suddenly broken for every song?** YouTube changes often. First update the extractors:
        `pip install -U "yt-dlp[default]" ytmusicapi` (the start scripts do this automatically; Docker users: pull/rebuild the image).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Device / browser / how you run the server (script, pip, Docker)
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console output
      render: text
