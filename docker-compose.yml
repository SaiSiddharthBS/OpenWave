services:
  openwave:
    build: .
    image: openwave
    ports:
      - "8787:8787"
    restart: unless-stopped
    volumes:
      - openwave-data:/data   # profiles, playlists, likes, history
    environment:
      # Optional: shape recommendations, e.g. OPENWAVE_LOCATION=IN, OPENWAVE_LANGUAGE=en
      - OPENWAVE_LOCATION=
      - OPENWAVE_LANGUAGE=

volumes:
  openwave-data:
